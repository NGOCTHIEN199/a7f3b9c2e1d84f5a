<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nhận Key — DuckCoin</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1117;color:#c9d1d9;font-family:Consolas,monospace;padding:20px}
  .box{width:100%;max-width:440px;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px 24px;text-align:center}
  .logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#58a6ff,#1f6feb);margin:0 auto 18px;box-shadow:0 0 24px rgba(88,166,255,.4)}
  h1{margin:0 0 6px;font-size:17px;color:#58a6ff;letter-spacing:1.5px}
  .sub{font-size:12px;color:#6e7681;margin-bottom:26px;line-height:1.6}
  button{width:100%;padding:14px;background:#1f6feb;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1.5px;cursor:pointer}
  button:hover{background:#388bfd}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:18px;padding:12px;border-radius:6px;font-size:12px;min-height:22px;background:#0d1117;border:1px dashed #30363d;line-height:1.5;white-space:pre-wrap}
  .err{color:#f85149;border-color:#6e1a1a}
  .ok{color:#3fb950;border-color:#1a4d2e}
  .note{margin-top:18px;font-size:10px;color:#6e7681;line-height:1.6}
</style></head>
<body><div class="box">
  <div class="logo"></div>
  <h1>NHẬN LICENSE KEY</h1>
  <div class="sub">1 máy = 1 key · hạn 2 ngày<br>cần vượt 1 bước xác minh</div>
  <button id="btn">NHẬN KEY</button>
  <div class="msg" id="msg">bấm nút để bắt đầu</div>
  <div class="note">key sẽ gắn với máy này — không share được</div>
</div>
<script>
const APPS_SCRIPT   = 'https://script.google.com/macros/s/AKfycbxGCxrkmnZeq0br4X8Xt_g4IS-jGLzQ0E-wK4ViH2A8CyMlD7cJvv1lcMobm7gFJQFu/exec';
const SHORTLINK_URL = 'https://link4m.net/tj7HN8';

const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

async function getHWID() {
  const parts = [];
  parts.push(navigator.userAgent || '');
  parts.push(navigator.platform || '');
  parts.push(navigator.language || '');
  parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
  parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
  parts.push(String(new Date().getTimezoneOffset()));
  parts.push(String(navigator.hardwareConcurrency || 0));
  parts.push(String(navigator.deviceMemory || 0));
  try {
    const c = document.createElement('canvas'); c.width = 200; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top'; ctx.font = '14px Arial';
    ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
    ctx.fillStyle = '#069'; ctx.fillText('DC-License-FP-2024', 2, 8);
    ctx.fillStyle = 'rgba(102,204,0,0.7)'; ctx.fillText('DC-License-FP-2024', 4, 10);
    parts.push(c.toDataURL());
  } catch(e) {}
  try {
    const c2 = document.createElement('canvas');
    const gl = c2.getContext('webgl') || c2.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        parts.push(String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || ''));
        parts.push(String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || ''));
      }
    }
  } catch(e) {}
  const raw = parts.join('|');
  const buf = new TextEncoder().encode(raw);
  const hb = await crypto.subtle.digest('SHA-256', buf);
  const hex = Array.from(new Uint8Array(hb)).map(b => b.toString(16).padStart(2,'0')).join('');
  return 'h_' + hex.slice(0, 40);
}

btn.onclick = async () => {
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = 'đang chuẩn bị...';

  try {
    const hwid = await getHWID();
    localStorage.setItem('dc_hwid', hwid);
    localStorage.setItem('dc_pending_at', String(Date.now()));
    msg.textContent = 'đang chuyển tới bước xác minh...';
    setTimeout(() => { location.href = SHORTLINK_URL; }, 500);
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = '❌ lỗi: ' + e.message;
    btn.disabled = false;
  }
};
</script>
</body></html>
